name: CI

on:
  push:
    branches: [master, phase-2-workmanager]
  pull_request:
    branches: [master, phase-2-workmanager]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: write
  checks: write

jobs:
  build:
    name: Unit tests & assembleDebug
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Unit tests and debug assemble
        run: ./gradlew testDebugUnitTest assembleDebug --stacktrace

      # Fork PRs get a read-only GITHUB_TOKEN; skip write-token steps there so the
      # required "Unit tests & assembleDebug" check still passes when tests succeed.
      - name: Upload unit test results
        if: >-
          always() &&
          (github.event_name != 'pull_request' ||
           github.event.pull_request.head.repo.full_name == github.repository)
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-results
          path: app/build/test-results/testDebugUnitTest/**
          if-no-files-found: ignore

      - name: Publish unit test report
        if: >-
          always() &&
          (github.event_name != 'pull_request' ||
           github.event.pull_request.head.repo.full_name == github.repository)
        uses: mikepenz/action-junit-report@v6
        with:
          report_paths: app/build/test-results/testDebugUnitTest/TEST-*.xml
          check_name: Unit test results
          require_tests: false
